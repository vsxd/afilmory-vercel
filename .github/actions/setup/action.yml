name: Setup
description: Install pnpm, Node.js, and project dependencies (with pnpm store caching)

inputs:
  install:
    description: >-
      Set to 'false' to skip `pnpm install` (and the pnpm store cache) for
      jobs that only need pnpm + Node, e.g. lockfile-only commands.
    required: false
    default: "true"
  node-version:
    description: Node.js version used by this job.
    required: false
    default: "22.22.2"

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

    - name: Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: ${{ inputs.node-version }}
        # An empty `cache` disables store caching; the store only matters for installs.
        cache: ${{ inputs.install == 'true' && 'pnpm' || '' }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
