packages:
  - apps/*
  - packages/*

catalog:
  "@egoist/tailwindcss-icons": 1.9.0
  "@iconify-json/mingcute": 1.2.5
  "@t3-oss/env-core": 0.13.8
  "@tailwindcss/postcss": 4.1.16
  "@tailwindcss/typography": 0.5.19
  clsx: 2.1.1
  dotenv: 17.2.3
  dotenv-expand: 13.0.0
  exiftool-vendored: 37.0.0
  motion: 12.23.24
  tailwind-merge: 3.3.1
  tailwind-scrollbar: 4.0.2
  tailwind-variants: 3.1.1
  tailwindcss: 4.1.16
  tailwindcss-animate: 1.0.7
  tailwindcss-safe-area: 1.1.0
  tailwindcss-uikit-colors: 1.0.0
  typescript: 7.0.2
  zod: 4.1.12

onlyBuiltDependencies:
  # Vite/tsx toolchain binary.
  - esbuild
  # Direct image-processing dependency of the root, builder and build-assets.
  - sharp
  # Native resolver pulled by eslint/import resolution; napi-postinstall selects
  # the already integrity-pinned platform binding from the lockfile.
  - unrs-resolver

ignoredBuiltDependencies:
  - simple-git-hooks

overrides:
  # Patched source-map handling; older transitive copies are vulnerable to
  # GHSA-4x5r-pxfx-6jf8 when compiling attacker-controlled input.
  "@babel/core": 7.29.6
  defu: 6.1.7
  eslint-config-hyoban>eslint-plugin-react-hooks: 7.1.1
  workbox-build>source-map: 0.7.6
