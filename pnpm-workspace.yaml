packages:
  - apps/*
  - packages/*

catalog:
  "@egoist/tailwindcss-icons": 1.9.2
  "@iconify-json/mingcute": 1.2.7
  "@t3-oss/env-core": 0.13.11
  "@tailwindcss/postcss": 4.3.3
  "@tailwindcss/typography": 0.5.20
  clsx: 2.1.1
  dotenv: 17.4.2
  dotenv-expand: 12.0.3
  exiftool-vendored: 35.20.0
  motion: 12.43.0
  tailwind-merge: 3.6.0
  tailwind-scrollbar: 4.0.2
  tailwind-variants: 3.3.0
  tailwindcss: 4.3.3
  tailwindcss-animate: 1.0.7
  tailwindcss-safe-area: 1.3.0
  tailwindcss-uikit-colors: 1.0.0
  typescript: 5.9.3
  zod: 4.4.3

onlyBuiltDependencies:
  # Vite/tsx toolchain binary.
  - esbuild
  # Direct image-processing dependency of the root, builder and build-assets.
  - sharp
  # Native resolver pulled by eslint/import resolution; napi-postinstall selects
  # the already integrity-pinned platform binding from the lockfile.
  - unrs-resolver

ignoredBuiltDependencies:
  - simple-git-hooks

overrides:
  # Patched source-map handling; older transitive copies are vulnerable to
  # GHSA-4x5r-pxfx-6jf8 when compiling attacker-controlled input.
  "@babel/core": 7.29.6
  defu: 6.1.7
  eslint-config-hyoban>eslint-plugin-react-hooks: 7.1.1
  # filelist's minimatch 5 range resolves to a brace-expansion release affected
  # by GHSA-mh99-v99m-4gvg. Minimatch 10 uses the patched brace-expansion API.
  filelist>minimatch: 10.2.6
  workbox-build>source-map: 0.7.6
